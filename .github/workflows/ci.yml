name: CI
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: mypy src/aiyoutubehands || true
      - run: pytest tests/ -q
      - run: test "$(cat VERSION)" = "$(python -c 'from aiyoutubehands import __version__; print(__version__)')"
